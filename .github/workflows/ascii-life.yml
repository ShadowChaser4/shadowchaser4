name: Update ASCII life widget

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate scene
        run: python3 scripts/generate_ascii.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/ascii-life.svg; then
            git add assets/ascii-life.svg
            git commit -m "chore: update ascii life widget"
            git push
          else
            echo "no change"
          fi
